<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindX Cinema - Sign up</title>
</head>
<style>
        :root {
      --bg: #0f172a;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #22c55e;
      --error: #ef4444;
      --border: #1f2937;
    }
    
    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% 10%, #0b1020 0%, var(--bg) 45%, #0b1020 100%);
      color: var(--text);
    }
    
    .container {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    
    .card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(8px);
    }
    
    h1 {
      margin: 0 0 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    .form-group.inline {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-weight: 600;
    }
    
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1220;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
    }
    
    .helper {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    
    .strength {
      height: 6px;
      border-radius: 6px;
      background: #1f2937;
      margin-top: 8px;
      overflow: hidden;
      position: relative;
    }
    .strength::after {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e);
      transition: width 0.25s ease;
    }
    
    .error {
      display: block;
      margin-top: 6px;
      color: var(--error);
      font-size: 12px;
    }
    
    .btn {
      width: 100%;
      padding: 12px 14px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3); }
    .btn:active { transform: translateY(0); }
    
    .footnote {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .footnote a { color: #93c5fd; text-decoration: none; }
    .footnote a:hover { text-decoration: underline; }

</style>
  <script>
    const form = document.getElementById('signupForm');

const fullName = document.getElementById('fullName');
const email = document.getElementById('email');
const password = document.getElementById('password');
const confirmPassword = document.getElementById('confirmPassword');
const username = document.getElementById('username');
const terms = document.getElementById('terms');

const nameError = document.getElementById('nameError');
const emailError = document.getElementById('emailError');
const passwordError = document.getElementById('passwordError');
const confirmError = document.getElementById('confirmError');
const usernameError = document.getElementById('usernameError');
const termsError = document.getElementById('termsError');

const strengthBar = document.getElementById('strengthBar');

function passwordStrength(pw) {
  let score = 0;
  if (!pw) return 0;
  if (pw.length >= 8) score += 1;
  if (/[A-Z]/.test(pw)) score += 1;
  if (/[a-z]/.test(pw)) score += 1;
  if (/[0-9]/.test(pw)) score += 1;
  if (/[^A-Za-z0-9]/.test(pw)) score += 1;
  return Math.min(score, 5);
}

function updateStrengthUI(score) {
  const percent = (score / 5) * 100;
  strengthBar.style.setProperty('--w', `${percent}%`);
  // Use ::after width via inline style
  strengthBar.style.setProperty('position', 'relative');
  strengthBar.style.setProperty('--width', `${percent}%`);
  strengthBar.style.setProperty('background', '#1f2937');
  strengthBar.style.setProperty('overflow', 'hidden');
  strengthBar.style.setProperty('borderRadius', '6px');
  strengthBar.style.setProperty('height', '6px');
  strengthBar.querySelectorAll = null;
  strengthBar.style.setProperty('boxShadow', 'none');
  strengthBar.style.setProperty('transition', 'none');
  strengthBar.style.setProperty('--dummy', '0');
  // Fallback: update ::after via direct style
  strengthBar.style.setProperty('--after-width', `${percent}%`);
  strengthBar.style.setProperty('backgroundImage', `linear-gradient(90deg, #1f2937 0%, #1f2937 100%)`);
  strengthBar.style.setProperty('backgroundSize', `${percent}% 100%`);
  strengthBar.style.setProperty('backgroundRepeat', 'no-repeat');
}

password.addEventListener('input', () => {
  const score = passwordStrength(password.value);
  // Simple width update using inline gradient trick
  const percent = (score / 5) * 100;
  strengthBar.style.backgroundImage = `linear-gradient(90deg, #22c55e ${percent}%, #1f2937 ${percent}%)`;
});

function clearErrors() {
  [nameError, emailError, passwordError, confirmError, usernameError, termsError]
    .forEach(e => e.textContent = '');
}

function validate() {
  clearErrors();
  let valid = true;

  if (fullName.value.trim().length < 2) {
    nameError.textContent = 'Vui lòng nhập họ tên hợp lệ.';
    valid = false;
  }

  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
  if (!emailPattern.test(email.value.trim())) {
    emailError.textContent = 'Email không hợp lệ.';
    valid = false;
  }

  const pw = password.value;
  const score = passwordStrength(pw);
  if (score < 3) {
    passwordError.textContent = 'Mật khẩu yếu. Hãy dùng chữ hoa, chữ thường, số và ký tự đặc biệt.';
    valid = false;
  }

  if (confirmPassword.value !== pw) {
    confirmError.textContent = 'Mật khẩu xác nhận không khớp.';
    valid = false;
  }

  const usernamePattern = /^[a-zA-Z0-9_.-]{3,20}$/;
  if (!usernamePattern.test(username.value.trim())) {
    usernameError.textContent = 'Tên người dùng 3–20 ký tự, chỉ gồm chữ, số, ., _, -';
    valid = false;
  }

  if (!terms.checked) {
    termsError.textContent = 'Bạn cần đồng ý với điều khoản.';
    valid = false;
  }

  return valid;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!validate()) return;

  const payload = {
    fullName: fullName.value.trim(),
    email: email.value.trim(),
    password: password.value, // Lưu ý: luôn mã hóa khi gửi lên server (HTTPS + hash)
    username: username.value.trim(),
    termsAccepted: true
  };

  // Demo: giả lập gọi API
  try {
    // Thay bằng endpoint thật của bạn, ví dụ: /api/auth/signup
    // const res = await fetch('/api/auth/signup', {
    //   method: 'POST',
    //   headers: { 'Content-Type': 'application/json' },
    //   body: JSON.stringify(payload)
    // });
    // const data = await res.json();
    // if (!res.ok) throw new Error(data.message || 'Đăng ký thất bại');

    alert('Đăng ký thành công! (Demo)');
    form.reset();
  } catch (err) {
    alert('Có lỗi xảy ra khi đăng ký. Vui lòng thử lại.');
    console.error(err);
  }
});

  </script>
<body>
  <main class="container">
    <form id="signupForm" class="card" novalidate>
      <h1>Đăng ký</h1>

      <div class="form-group">
        <label for="fullName">Họ và tên</label>
        <input type="text" id="fullName" name="fullName" placeholder="Ví dụ: Nguyễn Văn A" required />
        <small class="error" id="nameError"></small>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="ví dụ@domain.com" required />
        <small class="error" id="emailError"></small>
      </div>

      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" placeholder="Tối thiểu 8 ký tự" required minlength="8" />
        <small class="helper">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường, số.</small>
        <div class="strength" id="strengthBar" aria-hidden="true"></div>
        <small class="error" id="passwordError"></small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu" required />
        <small class="error" id="confirmError"></small>
      </div>

      <div class="form-group">
        <label for="username">Tên người dùng</label>
        <input type="text" id="username" name="username" placeholder="Tên hiển thị/đăng nhập" required />
        <small class="error" id="usernameError"></small>
      </div>

      <div class="form-group inline">
        <label class="checkbox">
          <input type="checkbox" id="terms" name="terms" required />
          <span>Tôi đồng ý với Điều khoản & Chính sách bảo mật</span>
        </label>
        <small class="error" id="termsError"></small>
      </div>

      <button type="submit" class="btn">Tạo tài khoản</button>

      <p class="footnote">
        Đã có tài khoản? <a href="/login">Đăng nhập</a>
      </p>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
